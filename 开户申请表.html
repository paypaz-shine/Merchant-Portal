<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paypaz · 企业开户申请</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Noto Sans SC','Inter',sans-serif; background:#F5F7FA; color:#303133; min-height:100vh; display:flex; flex-direction:column; font-size:13px; }
  .inter { font-family:'Inter',sans-serif; }

  /* ── Header（与商户后台顶栏一致） ───────────────── */
  .header-bar { height:56px; background:#1a2236; display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0; }
  .header-left { display:flex; align-items:center; gap:12px; }
  .header-left img { height:26px; object-fit:contain; }
  .header-sep { width:1px; height:16px; background:#3a4a63; }
  .header-sub { font-size:13px; color:#8a9ab5; }
  .header-icon { color:#8a9ab5; cursor:pointer; display:flex; align-items:center; }
  .header-icon:hover, .header-icon.active { color:#fff; }
  .header-icon svg.lucide { width:16px; height:16px; }
  .lang-menu { position:relative; }
  .lang-dropdown { display:none; position:absolute; top:calc(100% + 14px); right:-8px; width:140px; background:#fff; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.12); padding:4px 0; z-index:1000; }
  .lang-dropdown.show { display:block; }
  .lang-option { height:44px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#303133; cursor:pointer; white-space:nowrap; }
  .lang-option:hover { background:#F5F7FA; }
  .lang-option .lang-check { color:#67C23A; display:none; }
  .lang-option.active .lang-check { display:flex; }
  .lang-option svg.lucide { width:16px; height:16px; }

  /* ── Layout ─────────────────────────────────────── */
  .main { flex:1; padding:20px 16px 96px; }
  .wrap { max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border:1px solid #EBEEF5; border-radius:4px; }

  /* 申请概要 */
  .intro { padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .intro-title { font-size:16px; font-weight:600; color:#303133; }
  .intro-desc { font-size:12px; color:#909399; margin-top:6px; }
  .intro-meta { display:flex; gap:32px; flex-wrap:wrap; }
  .meta-item { display:flex; flex-direction:column; gap:6px; }
  .meta-label { font-size:12px; color:#909399; }
  .meta-value { font-size:13px; color:#303133; font-weight:500; }

  /* Steps（Element Steps 样式） */
  .steps { padding:20px 24px 16px; display:flex; overflow-x:auto; }
  .steps::-webkit-scrollbar { height:0; }
  .step { flex:1; min-width:96px; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; cursor:default; user-select:none; }
  .step::before { content:''; position:absolute; top:12px; left:calc(-50% + 18px); right:calc(50% + 18px); height:2px; background:#E4E7ED; }
  .step:first-child::before { display:none; }
  .step.line-done::before { background:#409EFF; }
  .step-icon { width:24px; height:24px; border-radius:50%; border:2px solid #C0C4CC; color:#C0C4CC; background:#fff; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; position:relative; z-index:1; }
  .step-title { font-size:13px; color:#C0C4CC; text-align:center; white-space:nowrap; }
  .step.clickable { cursor:pointer; }
  .step.clickable:hover .step-title { color:#409EFF; }
  .step.done .step-icon { border-color:#409EFF; color:#409EFF; }
  .step.done .step-title { color:#606266; }
  .step.current .step-icon { background:#409EFF; border-color:#409EFF; color:#fff; }
  .step.current .step-title { color:#303133; font-weight:600; }
  .step.visited .step-icon { border-color:#909399; color:#606266; }
  .step.visited .step-title { color:#606266; }
  .step.has-err .step-icon { border-color:#F56C6C; color:#F56C6C; background:#fff; }
  .step.has-err .step-title { color:#F56C6C; }
  .step-tag { font-size:12px; line-height:1; padding:3px 6px; border-radius:3px; background:#fdf6ec; color:#E6A23C; border:1px solid #faecd8; margin-top:-2px; }

  /* 表单卡片 */
  .form-card { display:flex; flex-direction:column; }
  .form-head { padding:18px 24px; border-bottom:1px solid #EBEEF5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .form-title { font-size:15px; font-weight:600; color:#303133; }
  .form-sub { font-size:12px; color:#909399; width:100%; }
  .form-body { padding:24px; display:flex; flex-direction:column; gap:24px; }
  .form-foot { padding:12px 24px; border-top:1px solid #EBEEF5; display:flex; align-items:center; gap:8px; }
  .form-foot .spacer { flex:1; }
  .save-hint { font-size:12px; color:#909399; }

  .sec-title { font-size:13px; font-weight:600; color:#303133; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .sec-title::before { content:''; width:3px; height:13px; background:#409EFF; border-radius:2px; }
  .sec-title .sec-note { font-weight:400; font-size:12px; color:#909399; }

  .fm-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 24px; }
  .fm-item { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .fm-item.span2 { grid-column:span 2; }
  .fm-label { font-size:13px; color:#606266; display:flex; align-items:center; gap:8px; min-height:18px; }
  .fm-label .opt { color:#909399; font-size:12px; }
  .fm-label .right { margin-left:auto; }
  .req { color:#F56C6C; margin-right:2px; }
  .fm-hint { font-size:12px; color:#909399; line-height:1.6; }
  .fm-err { font-size:12px; color:#F56C6C; display:none; }
  .fm-item.is-error .fm-err, .fm-item.is-error-other .fm-err { display:block; }
  .fm-item.is-error .field-input, .fm-item.is-error .field-select, .fm-item.is-error .field-textarea, .fm-item.is-error .sig-pad { border-color:#F56C6C; }

  /* ── Inputs & Buttons（沿用商户后台） ───────────── */
  .field-input, .field-select { height:32px; border:1px solid #DCDFE6; border-radius:4px; padding:0 10px; font-size:13px; color:#303133; background:#fff; outline:none; font-family:'Noto Sans SC',sans-serif; transition:border-color 0.2s; width:100%; }
  .field-textarea { border:1px solid #DCDFE6; border-radius:4px; padding:6px 10px; font-size:13px; color:#303133; background:#fff; outline:none; font-family:'Noto Sans SC',sans-serif; transition:border-color 0.2s; width:100%; min-height:60px; resize:vertical; line-height:1.6; }
  .field-input::placeholder, .field-textarea::placeholder { color:#C0C4CC; }
  .field-input:focus, .field-select:focus, .field-textarea:focus { border-color:#409EFF; }
  .field-input:disabled, .field-select:disabled, .field-textarea:disabled { background:#F5F7FA; color:#606266; cursor:not-allowed; border-color:#E4E7ED; }
  .select-wrap { position:relative; display:flex; align-items:center; width:100%; }
  .select-wrap .select-caret { position:absolute; right:8px; pointer-events:none; color:#C0C4CC; }
  .field-select { padding-right:28px; cursor:pointer; appearance:none; -webkit-appearance:none; }
  .field-select.placeholder { color:#C0C4CC; }
  .cnt-wrap { position:relative; width:100%; }
  .cnt-wrap .field-input { padding-right:64px; }
  .cnt { font-size:12px; color:#909399; font-family:'Inter',sans-serif; line-height:1; white-space:nowrap; }
  .cnt.over { color:#F56C6C; }
  .cnt-in { position:absolute; right:10px; top:50%; transform:translateY(-50%); pointer-events:none; }
  .cnt-row { display:flex; justify-content:flex-end; margin-top:-2px; }
  .field-input.is-over, .field-textarea.is-over { border-color:#F56C6C; }
  .opt-other .cnt-wrap { width:auto; }
  .opt-other .cnt-wrap .field-input { width:260px; }
  .phone-row { display:flex; gap:8px; }
  .phone-row .select-wrap { width:120px; flex-shrink:0; }
  .suffix-wrap { position:relative; }
  .suffix-wrap .field-input { padding-right:40px; }
  .suffix-wrap .suffix { position:absolute; right:10px; top:50%; transform:translateY(-50%); color:#909399; font-size:12px; font-family:'Inter',sans-serif; }

  .btn { height:32px; padding:0 15px; border-radius:4px; font-size:13px; font-family:'Noto Sans SC',sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; white-space:nowrap; transition:opacity 0.15s; }
  .btn:hover { opacity:0.85; }
  .btn-primary { background:#409EFF; color:#fff; }
  .btn-default { background:#fff; color:#606266; border:1px solid #DCDFE6; }
  .btn-sm { height:28px; padding:0 12px; font-size:12px; }
  .btn-text { background:none; color:#409EFF; padding:0; height:auto; }
  .btn-dashed { width:100%; height:40px; border:1px dashed #DCDFE6; background:#fff; color:#606266; }
  .btn-dashed:hover { border-color:#409EFF; color:#409EFF; opacity:1; }

  /* Element Radio / Checkbox（沿用商户后台） */
  .opt-group { display:flex; flex-wrap:wrap; gap:10px 24px; min-height:32px; align-items:center; }
  .opt-group.vertical { flex-direction:column; align-items:flex-start; gap:12px; }
  .el-radio, .el-checkbox { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .el-radio input, .el-checkbox input { position:absolute; width:0; height:0; opacity:0; margin:0; }
  .el-radio__inner { display:block; width:14px; height:14px; border:1px solid #DCDFE6; border-radius:50%; background:#fff; position:relative; flex-shrink:0; transition:border-color .25s,background-color .25s; }
  .el-radio:hover .el-radio__inner, .el-checkbox:hover .el-checkbox__inner { border-color:#409EFF; }
  .el-radio input:checked + .el-radio__inner { background:#409EFF; border-color:#409EFF; }
  .el-radio input:checked + .el-radio__inner::after { content:''; position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; top:50%; left:50%; transform:translate(-50%,-50%); }
  .el-checkbox__inner { display:block; position:relative; width:14px; height:14px; border:1px solid #DCDFE6; border-radius:2px; background:#fff; flex-shrink:0; transition:border-color .25s,background-color .25s; }
  .el-checkbox__inner::after { box-sizing:content-box; content:''; border:1px solid #fff; border-left:0; border-top:0; height:7px; width:3px; left:4px; top:1px; position:absolute; transform:rotate(45deg) scaleY(0); transition:transform .15s ease-in .05s; }
  .el-checkbox input:checked + .el-checkbox__inner { background:#409EFF; border-color:#409EFF; }
  .el-checkbox input:checked + .el-checkbox__inner::after { transform:rotate(45deg) scaleY(1); }
  .opt-label { font-size:13px; color:#606266; line-height:1.5; }
  .el-radio input:checked ~ .opt-label, .el-checkbox input:checked ~ .opt-label { color:#409EFF; }
  .el-radio.is-disabled, .el-checkbox.is-disabled { cursor:not-allowed; }
  .is-disabled .el-radio__inner, .is-disabled .el-checkbox__inner { background:#F5F7FA; border-color:#E4E7ED; }
  .is-disabled input:checked + .el-radio__inner, .is-disabled input:checked + .el-checkbox__inner { background:#A0CFFF; border-color:#A0CFFF; }
  .is-disabled .opt-label, .is-disabled input:checked ~ .opt-label { color:#909399; }
  .el-checkbox.top { align-items:flex-start; }
  .el-checkbox.top .el-checkbox__inner { margin-top:3px; }
  .opt-other { display:inline-flex; align-items:center; gap:8px; }
  .opt-other .field-input { width:220px; height:28px; }
  .opt-other.is-error .field-input { border-color:#F56C6C; }

  /* Badges / Alerts */
  .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:3px; font-size:12px; white-space:nowrap; line-height:1.2; }
  .badge-blue   { background:#ECF5FF; color:#409EFF; border:1px solid #D9ECFF; }
  .badge-orange { background:#fdf6ec; color:#E6A23C; border:1px solid #faecd8; }
  .badge-gray   { background:#f4f4f5; color:#909399; }
  .alert-box { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:4px; font-size:13px; line-height:1.6; }
  .alert-box .alert-icon { flex-shrink:0; margin-top:2px; }
  .alert-info    { background:#ECF5FF; border:1px solid #D9ECFF; color:#409EFF; }
  .alert-warning { background:#fdf6ec; border:1px solid #faecd8; color:#E6A23C; }
  .alert-danger  { background:#FEF0F0; border:1px solid #fde2e2; color:#F56C6C; }
  .alert-gray    { background:#F5F7FA; border:1px solid #EBEEF5; color:#909399; }
  .alert-body { flex:1; min-width:0; }
  .alert-title { font-weight:600; }
  .alert-text { color:#606266; }
  .supp-note { margin-top:8px; background:#fff; border:1px solid #faecd8; border-radius:4px; padding:10px 12px; color:#303133; font-family:'Inter',sans-serif; white-space:pre-wrap; }
  .supp-meta { margin-top:8px; color:#606266; font-size:12px; }

  /* 人员卡片 */
  .person-card { border:1px solid #EBEEF5; border-radius:4px; }
  .person-head { height:44px; padding:0 16px; background:#F5F7FA; border-bottom:1px solid #EBEEF5; display:flex; align-items:center; gap:8px; }
  .person-name { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:#303133; }
  .person-head .spacer { flex:1; }
  .icon-btn { color:#909399; cursor:pointer; display:flex; align-items:center; gap:4px; font-size:12px; }
  .icon-btn:hover { color:#F56C6C; }
  .person-body { padding:20px 16px; }
  .sub-block { grid-column:span 2; background:#FAFAFA; border:1px solid #EBEEF5; border-radius:4px; padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:18px 24px; }

  /* 上传 */
  .up-list { border:1px solid #EBEEF5; border-radius:4px; }
  .up-row { display:flex; align-items:flex-start; gap:16px; padding:14px 16px; }
  .up-row + .up-row { border-top:1px solid #EBEEF5; }
  .up-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .up-name { font-size:13px; color:#303133; }
  .up-files { display:flex; flex-direction:column; gap:4px; }
  .up-file { display:flex; align-items:center; gap:6px; font-size:12px; color:#606266; }
  .up-file .fname { font-family:'Inter',sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:420px; }
  .up-file .fsize { color:#909399; font-family:'Inter',sans-serif; }
  .up-file .fdel { color:#C0C4CC; cursor:pointer; display:flex; }
  .up-file .fdel:hover { color:#F56C6C; }
  .up-empty { font-size:12px; color:#C0C4CC; }
  .up-row.is-error .up-name { color:#F56C6C; }
  .up-row .fm-err { display:none; }
  .up-row.is-error .fm-err { display:block; }
  .up-action { flex-shrink:0; }
  .up-inline { margin-top:4px; }

  /* 声明原文 */
  .legal { background:#FAFAFA; border:1px solid #EBEEF5; border-radius:4px; padding:14px 16px; font-family:'Inter',sans-serif; font-size:13px; color:#606266; line-height:1.7; }
  .legal p + ul, .legal ul + p { margin-top:6px; }
  .legal ul { padding-left:18px; }
  .legal li + li { margin-top:4px; }
  .legal .ph { background:#fdf6ec; color:#E6A23C; padding:0 3px; border-radius:2px; }
  .proof-item { border:1px solid #EBEEF5; border-radius:4px; padding:12px 14px; }
  .proof-item.checked { border-color:#c6e2ff; background:#FAFCFF; }
  .proof-sub { margin:12px 0 0 22px; display:flex; flex-direction:column; gap:12px; }

  /* 签名 */
  .sig-pad { position:relative; border:1px dashed #C0C4CC; border-radius:4px; background:#FAFAFA; height:180px; touch-action:none; }
  .sig-pad canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  .sig-pad .sig-ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:6px; color:#C0C4CC; font-size:13px; pointer-events:none; }
  .sig-pad.is-ro canvas { cursor:default; }
  .sig-pad img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .sig-tools { display:flex; align-items:center; gap:12px; }
  .sig-tools .spacer { flex:1; }
  .kv { display:flex; gap:8px; font-size:13px; }
  .kv .k { color:#909399; }
  .kv .v { color:#303133; }

  /* 结果页 */
  .result { padding:64px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; }
  .result-icon { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .result-icon.ok { background:#f0f9eb; color:#67C23A; }
  .result-icon.warn { background:#f4f4f5; color:#909399; }
  .result-title { font-size:18px; font-weight:600; color:#303133; }
  .result-text { font-size:13px; color:#606266; line-height:1.8; max-width:520px; }
  .result .btn { margin-top:12px; }

  /* Toast（沿用商户后台） */
  .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-120px); background:#fff; border:1px solid #EBEEF5; border-radius:4px; padding:10px 20px; font-size:13px; color:#606266; box-shadow:0 4px 16px rgba(0,0,0,0.12); transition:transform 0.25s ease; z-index:9999; display:flex; align-items:center; gap:8px; max-width:480px; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast-icon-success { color:#67C23A; }
  .toast-icon-error { color:#F56C6C; }
  .toast svg.lucide { width:16px; height:16px; }

  /* 原型场景切换（仅演示用） */
  .demo-bar { position:fixed; right:16px; bottom:16px; background:#fff; border:1px solid #EBEEF5; border-radius:4px; box-shadow:0 2px 12px rgba(0,0,0,0.10); padding:10px 12px; display:flex; flex-direction:column; gap:8px; z-index:500; }
  .demo-bar .demo-t { font-size:12px; color:#909399; }
  .demo-bar .demo-opts { display:flex; gap:6px; flex-wrap:wrap; }
  .demo-bar .demo-opts span { font-size:12px; padding:4px 10px; border:1px solid #DCDFE6; border-radius:3px; color:#606266; cursor:pointer; }
  .demo-bar .demo-opts span.active { border-color:#409EFF; color:#409EFF; background:#ECF5FF; }

  @media (max-width:720px) {
    .header-bar { padding:0 16px; }
    .header-sep, .header-sub { display:none; }
    .intro { padding:16px; }
    .intro-meta { gap:16px; }
    .steps { padding:16px 8px 12px; }
    .form-head, .form-body, .form-foot { padding-left:16px; padding-right:16px; }
    .fm-grid, .sub-block { grid-template-columns:1fr; }
    .fm-item.span2, .sub-block { grid-column:auto; }
    .opt-other .field-input { width:160px; }
    .up-row { flex-direction:column; gap:10px; }
    .form-foot { flex-wrap:wrap; }
    .save-hint { width:100%; order:-1; }
    .demo-bar { left:16px; }
  }
</style>
</head>
<body>

<header class="header-bar">
  <div class="header-left">
    <img src="../Dev/Merchant%20Portal/images/logo.png" alt="Paypaz">
    <span class="header-sep"></span>
    <span class="header-sub" data-t="appName"></span>
  </div>
  <div class="lang-menu">
    <span class="header-icon" id="langIcon" onclick="toggleLangMenu(event)"><i data-lucide="globe"></i></span>
    <div class="lang-dropdown" id="langDropdown">
      <div class="lang-option" data-lang="zh" onclick="setLang('zh')"><span>简体中文</span><span class="lang-check"><i data-lucide="circle-check"></i></span></div>
      <div class="lang-option" data-lang="en" onclick="setLang('en')"><span>English</span><span class="lang-check"><i data-lucide="circle-check"></i></span></div>
    </div>
  </div>
</header>

<main class="main"><div class="wrap" id="app"></div></main>

<div class="toast" id="toast"><i id="toastIconEl" data-lucide="check-circle" class="toast-icon-success"></i><span id="toastMsg"></span></div>

<div class="demo-bar">
  <div class="demo-t">原型场景（仅演示，不属于页面）</div>
  <div class="demo-opts" id="demoOpts">
    <span data-s="fill" onclick="setScenario('fill')">填写中</span>
    <span data-s="supp" onclick="setScenario('supp')">需要补件</span>
    <span data-s="ro" onclick="setScenario('ro')">已提交（只读）</span>
    <span data-s="invalid" onclick="setScenario('invalid')">链接无效 / 过期</span>
  </div>
</div>

<script>
/* ══════════════════ 文案 ══════════════════ */
// 跟随系统语言：中文系统显示中文，其余（含识别不了）默认英文
let lang = /^zh\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'zh' : 'en';
const L = a => Array.isArray(a) ? (lang === 'zh' ? a[0] : a[1]) : (a || '');
const TXT = {
  appName: ['企业开户申请', 'Business Onboarding'],
  title: ['企业开户申请', 'Business Onboarding Application'],

const reEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function checkFields(fields, prefix, obj, out) {
  fields.forEach(fd => {
    if (fd.type === 'blank' || fd.type === 'fixed') return;
    if (fd.show && !fd.show(obj)) return;
    const path = `${prefix}.${fd.k}`, v = obj[fd.k];
    const nm = L(fd.l);
    const choose = ['radio','checks','select','country'].includes(fd.type);
    const empty = fd.type === 'checks' ? !(v && v.length) : fd.type === 'address' ? !(obj.physSame || tlen(v)) : !tlen(v);
    if (empty) { if (fd.req) out[path] = (choose ? t('errSelect') : t('errEnter')) + nm; return; }
    if (fd.type === 'address' && obj.physSame) return;
    const sv = String(v).trim();
    if (fd.max && sv.length > fd.max) { out[path] = errMax(nm, fd.max); return; }
    if (fd.fmt && !fd.fmt.re.test(sv)) { out[path] = L(fd.fmt.msg); return; }
    if (fd.type === 'email' && !reEmail.test(sv)) out[path] = t('errEmail');
    if (fd.type === 'phone' && (!obj[fd.k + 'Code'] || !/^[\d\s-]{5,20}$/.test(sv) || sv.replace(/\D/g, '').length < 5)) out[path] = t('errPhone');
    if (fd.type === 'pct') { const n = Number(sv); if (!/^\d{1,3}(\.\d{1,2})?$/.test(sv) || n > 100) out[path] = t('errPct'); }
    if (fd.type === 'amount') { const a = sv.replace(/,/g, ''); if (!/^\d{1,15}(\.\d{1,2})?$/.test(a) || Number(a) <= 0) out[path] = t('errAmount'); }
    if (fd.future && v <= today()) out[path] = t('errExpiry');
    if (fd.other) {
      const sel = fd.type === 'checks' ? v.includes('other') : v === 'other';
      const op = `${prefix}.${fd.other}`, ov = obj[fd.other];
      if (sel && !tlen(ov)) out[op] = t('errOther');
      else if (sel && tlen(ov) > fd.otherMax) out[op] = errMax(lang === 'zh' ? '「其他」说明' : '"Others" description', fd.otherMax);
    }
  });
}
function validateStep(n) {
  const out = {}, d = S.d;
  if (n === 1) checkFields(SCHEMA.e, 'e', d.e, out);
  if (n === 2) checkFields(SCHEMA.c, 'c', d.c, out);
  if (n === 3) checkFields(SCHEMA.a, 'a', d.a, out);
  if (n === 4) {
    d.p.forEach((p, i) => checkFields(SCHEMA.p, `p.${i}`, p, out));
    const roles = d.p.flatMap(p => p.roles || []), miss = [];
    if (!roles.includes('director')) miss.push(t('errDirector'));
    if (!roles.includes('ubo')) miss.push(t('errUbo'));
    if (miss.length) out['p._roles'] = miss.join(lang === 'zh' ? '；' : '; ');
  }
  if (n === 5) {
    checkFields(SCHEMA.w, 'w', d.w, out);
    if (!d.w.agreeOwn) out['w.agreeOwn'] = t('errAgree');
    if (!d.w.agreeRisk) out['w.agreeRisk'] = t('errAgree');
    const pr = d.w.proofs || [];
    if (!pr.length) out['w.proofs'] = t('errProof');
    pr.forEach(v => {
      if (!(d.files['w_' + v] || []).length) out['files.w_' + v] = t('errUpload') + (lang === 'zh' ? '文件' : 'a file');
      if (v === 'explorer') {
        if (!d.w.proofMethod) out['w.proofMethod'] = t('errSelect') + L(TXT.proofMethod);
        if (!(d.w.proofContent || '').trim()) out['w.proofContent'] = t('errEnter') + L(TXT.proofContent);
        else if (tlen(d.w.proofContent) > MAXLEN.w.proofContent) out['w.proofContent'] = errMax(L(TXT.proofContent), MAXLEN.w.proofContent);
      }
      if (v === 'other' && !(d.w.proofOther || '').trim()) out['w.proofOther'] = t('errEnter') + L(TXT.proofOtherDesc);
      else if (v === 'other' && tlen(d.w.proofOther) > MAXLEN.w.proofOther) out['w.proofOther'] = errMax(L(TXT.proofOtherDesc), MAXLEN.w.proofOther);
    });
  }
  if (n === 6) {
    checkFields(SCHEMA.d, 'd', d.d, out);
    if (!d.d.agree) out['d.agree'] = t('errAgree');
    if (!d.d.sig) out['d.sig'] = t('errSig');
  }
  return out;
}

/* ══════════════════ 页面渲染 ══════════════════ */
function introHTML() {
  return `<div class="card intro">
    <div><div class="intro-title">${t('title')}</div><div class="intro-desc">${t('introDesc')}</div></div>
    <div class="intro-meta">
      <div class="meta-item"><span class="meta-label">${t('company')}</span><span class="meta-value">${esc(APP.company)}</span></div>
      <div class="meta-item"><span class="meta-label">${t('appNo')}</span><span class="meta-value inter">${APP.no}</span></div>
      ${S.mode !== 'ro' ? `<div class="meta-item"><span class="meta-label">${t('expire')}</span><span class="meta-value inter">${S.expire} UTC</span></div>` : ''}
    </div></div>`;
}
function bannerHTML() {
  if (S.mode === 'supp') {
    const parts = S.supp.parts.map(n => CIRCLED[n] + ' ' + L(STEPS[n - 1].l)).join(lang === 'zh' ? '、' : ', ');
    return `<div class="alert-box alert-warning"><i data-lucide="alert-triangle" class="alert-icon" style="width:16px;height:16px"></i>
      <div class="alert-body"><div class="alert-title">${t('suppTitle')}</div><div class="alert-text">${t('suppText')}</div>
      <div class="supp-note">${esc(S.supp.note)}</div>
      <div class="supp-meta">${t('suppScope')}：${esc(parts)}</div></div></div>`;
  }
  if (S.mode === 'ro') {
    return `<div class="alert-box alert-info"><i data-lucide="check-circle" class="alert-icon" style="width:16px;height:16px"></i>
      <div class="alert-body"><div class="alert-title">${t('roTitle')}</div><div class="alert-text">${t('roText')}</div></div></div>`;
  }
  return '';
}
function stepsHTML() {
  const errSteps = S.errSteps || new Set();
  return `<div class="card steps">${STEPS.map(st => {
    const n = st.n, cur = n === S.step, done = S.done.has(n);
    const clickable = !cur && (S.mode !== 'fill' || n <= S.reached);
    const cls = [cur ? 'current' : done ? 'done' : n <= S.reached ? 'visited' : '', clickable ? 'clickable' : '',
      n > 1 && S.done.has(n - 1) ? 'line-done' : '', errSteps.has(n) && !cur ? 'has-err' : ''].join(' ');
    const tag = S.mode === 'supp' && S.supp.parts.includes(n) ? `<span class="step-tag">${t('suppTag')}</span>` : '';
    const ic = errSteps.has(n) && !cur ? '!' : done && !cur ? icon('check', 13) : n;
    return `<div class="step ${cls}" ${clickable ? `onclick="goStep(${n})"` : ''}><span class="step-icon">${ic}</span><span class="step-title">${esc(L(st.l))}</span>${tag}</div>`;
  }).join('')}</div>`;
}
function footHTML() {
  const n = S.step, ed = stepEditable(n);
  const prev = n > 1 ? `<button class="btn btn-default" onclick="goStep(${n - 1})">${icon('chevron-left')}${t('prev')}</button>` : '';
  let right;
  if (!ed) right = n < 6 ? `<button class="btn btn-primary" onclick="goStep(${n + 1})">${t('next')}${icon('chevron-right')}</button>` : '';
  else if (n < 6) right = `<button class="btn btn-default" onclick="saveDraft()">${t('save')}</button><button class="btn btn-primary" onclick="saveNext()">${t('saveNext')}</button>`;
  else right = `<button class="btn btn-default" onclick="saveDraft()">${t('save')}</button><button class="btn btn-primary" onclick="submitApp()">${icon('send')}${t('submit')}</button>`;
  const hint = ed && S.savedAt ? `<span class="save-hint">${t('savedAt')} ${S.savedAt}</span>` : '';
  return `<div class="form-foot">${prev}<span class="spacer"></span>${hint}${right}</div>`;
}
function formHTML() {
  const st = STEPS[S.step - 1], ed = stepEditable(S.step);
  const tag = S.mode === 'supp' && S.supp.parts.includes(S.step) ? `<span class="badge badge-orange">${t('suppTag')}</span>` : '';
  const showRo = S.mode === 'supp' && !ed;
  return `<div class="card form-card">
    <div class="form-head"><span class="form-title">${CIRCLED[S.step]} ${esc(L(st.l))}</span>${tag}<span class="form-sub">${esc(L(st.sub))}</span></div>
    <div class="form-body" id="formBody">${roNote(showRo)}${RENDER[S.step](!ed)}</div>
    ${footHTML()}</div>`;
}
function render(keepScroll) {
  const y = window.scrollY;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('.lang-option').forEach(el => el.classList.toggle('active', el.dataset.lang === lang));
  document.querySelectorAll('#demoOpts span').forEach(el => el.classList.toggle('active', el.dataset.s === S.scenario));
  const app = document.getElementById('app');
  if (S.view === 'invalid') {
    app.innerHTML = `<div class="card result"><div class="result-icon warn">${icon('link-2-off', 26)}</div><div class="result-title">${t('invalidTitle')}</div><div class="result-text">${t('invalidText')}</div></div>`;
  } else if (S.view === 'success') {
    app.innerHTML = `${introHTML()}<div class="card result"><div class="result-icon ok">${icon('check', 28)}</div><div class="result-title">${t('okTitle')}</div><div class="result-text">${t('okText')}</div>
      <button class="btn btn-default" onclick="viewSubmitted()">${icon('file-text')}${t('viewSubmitted')}</button></div>`;
  } else {
    app.innerHTML = introHTML() + bannerHTML() + stepsHTML() + formHTML();
    if (S.step === 6 && stepEditable(6)) initSig();
  }
  lucide.createIcons();
  if (keepScroll) window.scrollTo(0, y);
}

/* ══════════════════ 交互 ══════════════════ */
document.addEventListener('input', e => {
  const el = e.target, path = el.dataset && el.dataset.path;
  if (!path || el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  setP(path, el.value);
  clearErr(path);
  const c = document.querySelector(`[data-cnt-for="${CSS.escape(path)}"]`);
  if (c) {
    const n = tlen(el.value), over = n > Number(c.dataset.max);
    c.textContent = `${n}/${c.dataset.max}`;
    c.classList.toggle('over', over); el.classList.toggle('is-over', over);
  }
});
document.addEventListener('change', e => {
  const el = e.target, path = el.dataset && el.dataset.path;
  if (!path) return;
  if (el.type === 'checkbox' && el.dataset.bool) setP(path, el.checked);
  else if (el.dataset.multi) {
    const arr = (getP(path) || []).filter(v => v !== el.value);
    if (el.checked) arr.push(el.value);
    setP(path, arr);
  } else if (el.type === 'radio' || el.tagName === 'SELECT') setP(path, el.value);
  else return;
  clearErr(path);
  if (path.endsWith('.roles')) delete errors['p._roles'];
  render(true);
});
function clearErr(path) {
  if (!errors[path]) return;
  delete errors[path];
  const box = document.querySelector(`[data-err-for="${CSS.escape(path)}"]`);
  if (box) box.classList.remove('is-error');
  const fi = box && box.closest('.fm-item.is-error-other');
  if (fi) fi.classList.remove('is-error-other');
}

function goStep(n) {
  if (n < 1 || n > 6) return;
  errors = {};
  S.step = n; S.reached = Math.max(S.reached, n);
  if (n === 5 && stepEditable(5) && !S.d.w.idNo && S.d.e.regNo) S.d.w.idNo = S.d.e.regNo;
  render(); window.scrollTo(0, 0);
}
function saveDraft() {
  S.savedAt = nowStr();
  render(true);
  showToast(t('saved'));
}
function focusFirstError() {
  const box = document.querySelector('#formBody .is-error, #formBody .alert-danger');
  if (!box) return;
  box.scrollIntoView({ behavior:'smooth', block:'center' });
  const inp = box.querySelector('input:not([type=checkbox]):not([type=radio]), select, textarea');
  if (inp) setTimeout(() => inp.focus({ preventScroll:true }), 300);
}
function saveNext() {
  errors = validateStep(S.step);
  if (Object.keys(errors).length) {
    (S.errSteps = S.errSteps || new Set()).add(S.step);
    render(true); showToast(t('errFix'), 'error'); focusFirstError(); return;
  }
  S.errSteps && S.errSteps.delete(S.step);
  S.done.add(S.step); S.savedAt = nowStr();
  showToast(t('saved'));
  goStep(S.step + 1);
}
function submitApp() {
  const toCheck = [1,2,3,4,5,6].filter(stepEditable);
  S.errSteps = new Set();
  let first = null;
  toCheck.forEach(n => { if (Object.keys(validateStep(n)).length) { S.errSteps.add(n); if (!first) first = n; } });
  if (first) {
    S.step = first; S.reached = Math.max(S.reached, first);
    errors = validateStep(first);
    render(); showToast(t('errStep').replace('{n}', CIRCLED[first]), 'error'); focusFirstError(); return;
  }
  S.done = new Set([1,2,3,4,5,6]);
  S.d.d.signedAt = new Date().toISOString().slice(0, 19).replace('T', ' ');
  S.d.d.ip = '203.0.113.24';
  S.view = 'success';
  render(); window.scrollTo(0, 0);
}
function viewSubmitted() {
  S.mode = 'ro'; S.view = 'form'; S.step = 1; S.errSteps = new Set(); errors = {};
  render(); window.scrollTo(0, 0);
}
function addPerson() {
  S.d.pid += 1; S.d.p.push(blankPerson(S.d.pid));
  delete errors['p._roles'];
  render(true);
}
function removePerson(i) {
  const p = S.d.p[i];
  delete S.d.files[`p${p.id}_docs`];
  S.d.p.splice(i, 1);
  errors = {};
  render(true);
}
function pickFile(key) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = '.pdf,.jpg,.jpeg,.png';
  inp.onchange = () => {
    const ok = [];
    for (const fl of inp.files) {
      if (!/\.(pdf|jpe?g|png)$/i.test(fl.name)) { showToast(t('upBadType'), 'error'); continue; }
      if (fl.size > 10 * 1024 * 1024) { showToast(t('upTooBig'), 'error'); continue; }
      ok.push({ name: fl.name, size: fl.size });
    }
    if (!ok.length) return;
    S.d.files[key] = (S.d.files[key] || []).concat(ok);
    delete errors['files.' + key];
    render(true);
  };
  inp.click();
}
function delFile(key, j) { S.d.files[key].splice(j, 1); render(true); }

/* 签名板 */
function initSig() {
  const pad = document.getElementById('sigPad'), cv = document.getElementById('sigCanvas');
  if (!pad) return;
  const r = window.devicePixelRatio || 1, w = pad.clientWidth, h = pad.clientHeight;
  cv.width = w * r; cv.height = h * r;
  const ctx = cv.getContext('2d');
  ctx.scale(r, r); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#303133';
  if (S.d.d.sig) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, w, h); img.src = S.d.d.sig; }
  let drawing = false, last = null, moved = false;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  cv.addEventListener('pointerdown', e => { drawing = true; moved = false; last = pos(e); cv.setPointerCapture(e.pointerId); document.getElementById('sigPh').style.display = 'none'; });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; moved = true;
  });
  const end = () => {
    if (!drawing) return; drawing = false;
    if (moved) { S.d.d.sig = cv.toDataURL('image/png'); clearErr('d.sig'); }
    else if (!S.d.d.sig) document.getElementById('sigPh').style.display = '';
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function clearSig() { S.d.d.sig = null; render(true); }
function fakeSignature() {
  const cv = document.createElement('canvas'); cv.width = 600; cv.height = 180;
  const c = cv.getContext('2d'); c.lineWidth = 2.5; c.lineCap = 'round'; c.strokeStyle = '#303133';
  c.beginPath(); c.moveTo(170, 120);
  c.bezierCurveTo(190, 40, 230, 40, 220, 110); c.bezierCurveTo(215, 140, 250, 70, 270, 95);
  c.bezierCurveTo(290, 120, 300, 60, 320, 90); c.bezierCurveTo(335, 115, 350, 70, 375, 85);
  c.bezierCurveTo(400, 100, 410, 75, 430, 80); c.stroke();
  c.beginPath(); c.moveTo(160, 132); c.bezierCurveTo(260, 122, 360, 126, 450, 116); c.stroke();
  return cv.toDataURL('image/png');
}

/* 语言 / 场景 */
function setLang(l) { closeLangMenu(); lang = l; errors = {}; render(true); }
function toggleLangMenu(e) {
  e.stopPropagation();
  const show = document.getElementById('langDropdown').classList.toggle('show');
  document.getElementById('langIcon').classList.toggle('active', show);
}
function closeLangMenu() {
  document.getElementById('langDropdown').classList.remove('show');
  document.getElementById('langIcon').classList.remove('active');
}
document.addEventListener('click', e => { if (!e.target.closest('.lang-menu')) closeLangMenu(); });
function setScenario(s) {
  errors = {};
  if (s === 'fill') S = initFill();
  if (s === 'supp') S = initSupp();
  if (s === 'ro') S = initRo();
  if (s === 'invalid') S = Object.assign(initFill(), { view:'invalid' });
  S.scenario = s;
  render(); window.scrollTo(0, 0);
}
window.addEventListener('resize', () => { if (S.view === 'form' && S.step === 6 && stepEditable(6)) initSig(); });

setScenario('fill');
</script>
